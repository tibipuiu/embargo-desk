{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<h1>{{ user.display_name }}</h1>
<p class="muted">Signed in as {{ user.username }}{% if user.is_admin %} (admin){% endif %}.</p>
<section class="panel">
  <h2>Change password</h2>
  <form method="post" action="/account/password" class="stack">
    <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password <input name="new" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="primary">Change password</button>
  </form>
</section>
{% endblock %}
