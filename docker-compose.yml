# For Coolify's Docker Compose build pack (v4) or plain `docker compose up`.
# On Coolify v3, use the Dockerfile build pack instead (see README).
#
# Variables below show up in Coolify's Environment Variables tab. ":?" marks required ones.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - embargo-data:/data   # database and digests
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      TZ: ${TZ:-Europe/Bucharest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      EMBARGOED_ONLY: ${EMBARGOED_ONLY:-true}
      MAX_DEEP_REVIEWS: ${MAX_DEEP_REVIEWS:-25}

volumes:
  embargo-data:
